# RA05 bounded authorized-shape composition. Synthetic/local use only.
# The caller presents a Kratos session. Gate resolves the fresh ASO projection
# grant, mints the fixed RS256 downstream token, and replaces Authorization
# before forwarding to FRF. No clinical, media, agent, or catch-all route is
# mounted by this configuration.

server:
  listen: "0.0.0.0:4456"
  admin_listen: "127.0.0.1:4457"
  strict_agent_governance: true
  tls:
    enabled: false

database:
  url: "postgres://flint:flint@db:5432/flintgate"
  max_connections: 5
  override_yaml: false

authority:
  enabled: true
  source_key: "aso"
  max_connections: 2

cache:
  l1:
    max_capacity: 1000
    ttl_seconds: 30
  l2:
    enabled: true
    redis_url: "redis://redis:6379"

jwt:
  signing_algorithm: "RS256"
  signing_key_path: "/run/ra05-keys/private.pem"
  signing_key_id: "aso-ra05-local"
  issuer: "https://gate.aso.local"
  default_ttl_seconds: 60

auth_providers:
  passthrough:
    type: anonymous
    default_subject: "anonymous"
  kratos_session:
    type: kratos
    base_url: "http://kratos:4433"
    issuer: "http://127.0.0.1:4433"
    forward_cookies: true
    session_cookie: "ory_kratos_session"

sites:
  - id: "aso-authorized-shape"
    domains:
      - "localhost:4456"
      - "127.0.0.1:4456"
      - "localhost:4458"
      - "127.0.0.1:4458"
      - "flint-gate:4456"
      - "shape-gateway:4456"
    default_auth: kratos_session
    default_upstream: "http://realtime-fabric:8080"
  - id: "aso-clinical"
    domains:
      - "clinical-gateway:4456"
    default_auth: passthrough
    default_upstream: "http://host.docker.internal:8788"

routes:
  - id: "aso-authorized-shape"
    site: "aso-authorized-shape"
    match:
      path: "/v1/shape"
      methods: ["GET"]
    auth: kratos_session
    priority: 100
    hooks:
      pre_request:
        - type: claims_enhancement
          config:
            aso_replica_grant:
              url: "http://aso-api:8788/api/session/replica-grant"
              audience: "frf-gateway"
              # RA06: 3 s covers the 1,750 ms lease plus whole-second JWT truncation.
              max_ttl_seconds: 3
  - id: "aso-annotation-save"
    site: "aso-clinical"
    match:
      path: "/api/cases/*/annotations/*"
      methods: ["POST"]
    auth: passthrough
    priority: 101
    hooks:
      pre_request:
        - type: aso_clinical_authorize
          config:
            url: "http://aso-api:8788/internal/gate/authorize"
  - id: "aso-annotation-command"
    site: "aso-clinical"
    match:
      path: "/api/cases/*/annotations/*/commands/*"
      methods: ["GET"]
    auth: passthrough
    priority: 102
    hooks:
      pre_request:
        - type: aso_clinical_authorize
          config:
            url: "http://aso-api:8788/internal/gate/authorize"
