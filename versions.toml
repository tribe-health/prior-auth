[decisions]
# id = "rationale"
ra11a_sql_materializer = "Blocked: @electric-sql/pglite-sync 0.6.9 with @electric-sql/pglite 0.5.8, @electric-sql/client 1.0.14, and @electric-sql/experimental 1.0.14 received HTTP 400 for unsupported log=full at the authorized FRF facade before materialization and has not proved crash-safe coordinated commits; adoption is prohibited. A future candidate must still pass the 512 MiB incremental RSS gate."
ra11c_pem_persistence_control = "Approved independently of materializer adoption: exact PEM core/react 4.0.3-ra11c.1.g071b9e5.sbb3dc7729aa7 add an optional scoped-runtime persistence switch used only by the memory-only browser qualification. The default remains enabled. Offline frozen install and the prior 158-test focused source passed; the current authority-freshness source passes its 11 focused tests, and ordered cold folding passes 22 transport tests plus effective delete-last and missing-update negative controls. TypeScript and lint pass. Current-source mounted update/delete/crash/refetch, restart, owner fence, checkpoint and graph parity passed all 11 behavioral checks and five cleanup checks; the mounted restart also disproved and reversed a proposed stale-plan generation guard. The aggregate suite remains Build-only because varying PGlite cases time out on this host. This pin does not approve the blocked RA11c PGlite materializer."
ra11c_sql_materializer = "Blocked from production adoption: the bounded internal FRF adapter preserves Electric message order during cold folding, requires update to target an existing cold row, and passes current-source mounted update/delete/crash/refetch, restart, owner-fence, checkpoint and graph-parity behavior with all 11 checks and five cleanup checks true. The live authority guard passes 11 focused tests; the transport passes 22 tests and its denial errors do not consume or publish upstream response bodies; the transport/writer/runtime/ledger set passes 75 tests with effective negative controls and preserves insert/update operation semantics; TypeScript and lint pass. The aggregate suite remains Build-only because varying PGlite cases time out on this host. PGlite 0.5.8 peaks at 1,016,692,736 incremental RSS bytes above the fixed 536,870,912-byte limit for the 16,203-row memory-only browser baseline; heap passes at 77,579,792 bytes. GraphProvider keeps the materializer disabled by default and accepts only VITE_ASO_ENABLE_RA11C_MATERIALIZER=experimental for qualification runs. This evidence does not approve @electric-sql/pglite-sync or a raised post-measurement threshold."
ra17_native_session_facility = "Approved desktop target: the Rust host keeps the opaque Kratos session token in the operating-system credential store through keyring 4.2.0 and wraps transient copies with secrecy 0.10.3. Kratos 26.2.0 native API login and whoami are the mounted password-transport qualification path; production OIDC uses the system browser with Tauri 2.11.5, opener 2.5.5, deep-link 2.4.10 and single-instance 2.4.4, a host-validated one-time exchange callback, and no token in a URL. Stronghold is not the session-token facility because its vault needs a second unlock secret and its standard command surface is renderer callable. The Tauri Zustand plugin stores no credential, session authority or clinical state. Missing platform keyring, OIDC provider configuration or callback validation fails closed; no plaintext or renderer fallback is permitted."
