# ═══════════════════════════════════════════════════════════════════════════
# Prior Authorization Workbench — practice-boundary stack.
#
#   docker compose up -d
#   docker compose down -v      # -v is required to re-run the schema bootstrap
#
# ── The rule this file exists to hold ──────────────────────────────────────
#
# PHI at rest stays inside the practice boundary and inside the United States
# (Texas SB 1188, effective 2026-01-01). No service here moves it outside.
# The only PHI egress in the product is to a BAA-covered inference endpoint
# with zero data retention, gated by Cedar policy — and that service is not in
# this file.
#
# ── One Postgres, several databases ────────────────────────────────────────
#
# flint-forge's postgres18 image is the single instance. It already starts with
# `wal_level=logical` (images/postgres18/Dockerfile:155), which is what Electric
# requires — that is why this image, not `postgres:16-alpine`.
#
# flint-gate's own compose uses postgres:16-alpine. It is a working example, not
# a maintained pin; adapt it rather than copy it.
#
# Kratos owns and migrates its own schema in its own database. `aso.*` must
# never FK into Kratos tables — `users.kratos_identity_id` is a soft reference
# by design (docs/design/schema/schema.sql:230-257).
# ═══════════════════════════════════════════════════════════════════════════

name: aso-prior-auth-demo

services:
  # ── Data plane ───────────────────────────────────────────────────────────
  db:
    image: ${ASO_DB_IMAGE:-aso-prior-auth-db:local}
    build:
      context: ${PROMETHEUS_ROOT:-/Users/gqadonis/Projects/prometheus}/flint-forge
      dockerfile: images/postgres18/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flint}
      POSTGRES_DB: ${POSTGRES_DB:-flint}
      # Kratos and flint-gate databases are created by
      # docker/bootstrap/00-create-databases.sh — this image does not implement
      # the POSTGRES_MULTIPLE_DATABASES convention.
    volumes:
      # Postgres 18 changed the volume convention: PGDATA is
      # /var/lib/postgresql/18/docker and the image declares VOLUME
      # /var/lib/postgresql. Mounting at .../data — the pg17-and-earlier path —
      # makes the entrypoint see stray data in an "unused mount/volume" and
      # refuse to start, in a restart loop. Observed 2026-09-05.
      # See docker-library/postgres#1259.
      - db_data:/var/lib/postgresql
      # Bootstrap runs on FIRST START ONLY. Postgres skips this directory when
      # the data volume already exists.
      - ./docker/bootstrap:/docker-entrypoint-initdb.d:ro
      - ./docs/design/schema:/schema:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flint} -d ${POSTGRES_DB:-flint}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ── Read-path sync ───────────────────────────────────────────────────────
  # Serves the BASE TABLES. Electric cannot serve a view — measured 2026-09-06:
  #   GET /v1/shape?table=aso.sync_cases -> 400 "does not exist"
  #   GET /v1/shape?table=aso.cases      -> 200                    [control]
  # A view emits no WAL, so it can never join a publication; materialized views
  # fail identically and Postgres refuses them outright. The sync_* views in
  # docker/bootstrap/20-*.sql are SUPERSEDED as the sync path and remain only as
  # documentation plus a PHI assertion over themselves.
  #
  # The tenant boundary is therefore the denormalized, trigger-forced
  # practice_id column (docker/bootstrap/15-*.sql), and the PHI boundary is the
  # per-shape `columns=` projection in web/src/shared/sync/electric-shapes.ts.
  #
  # Electric remains internal to the Compose network. It runs in insecure mode
  # because Gate/FRF terminate authorization before forwarding a bounded shape;
  # publishing this port would let a host caller bypass that boundary.
  electric:
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flint}:${POSTGRES_PASSWORD:-flint}@db:5432/${POSTGRES_DB:-flint}
      ELECTRIC_INSECURE: "true"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Identity ─────────────────────────────────────────────────────────────
  # v26.2.0, matching @ory/kratos-client-fetch@26.2.0 in the web app.
  # flint-gate's reference compose pins v1.2 — roughly 25 majors stale.
  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes
    environment:
      DSN: postgres://${POSTGRES_USER:-flint}:${POSTGRES_PASSWORD:-flint}@db:5432/kratos?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  kratos:
    image: oryd/kratos:v26.2.0
    # Kratos REQUIRES a config file: `identity.schemas` and
    # `selfservice.default_browser_return_url` have no environment-variable
    # equivalent, and without them the container restart-loops on
    # "validation failed". Observed 2026-09-05.
    command: serve all --dev --watch-courier --config /etc/config/kratos/kratos.yml
    volumes:
      - ./docker/kratos:/etc/config/kratos:ro
    environment:
      DSN: postgres://${POSTGRES_USER:-flint}:${POSTGRES_PASSWORD:-flint}@db:5432/kratos?sslmode=disable
      LOG_LEVEL: info
      SERVE_PUBLIC_BASE_URL: http://127.0.0.1:${KRATOS_PUBLIC_PORT:-4433}/
      SERVE_ADMIN_BASE_URL: http://kratos:4434/
    ports:
      - "${KRATOS_PUBLIC_PORT:-4433}:4433"
      - "${KRATOS_ADMIN_PORT:-4434}:4434"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Applies every checksum-verified server migration before either the demo
  # fixture or API starts. This job is safe to rerun against an existing volume.
  aso-migrate:
    image: ${ASO_API_IMAGE:-aso-prior-auth-api:local}
    build:
      context: .
      dockerfile: Dockerfile.demo
      target: api
    command: ["--migrate-server"]
    environment:
      ASO_MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-flint}:${POSTGRES_PASSWORD:-flint}@db:5432/${POSTGRES_DB:-flint}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Creates a deterministic local-only login and synthetic case after both
  # schema owners have completed their migrations.
  aso-demo-init:
    image: ${ASO_DB_IMAGE:-aso-prior-auth-db:local}
    entrypoint: ["/bin/sh", "/demo-init.sh"]
    environment:
      ASO_MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-flint}:${POSTGRES_PASSWORD:-flint}@db:5432/${POSTGRES_DB:-flint}
      ASO_KRATOS_ADMIN_URL: http://kratos:4434
      ASO_DEMO_EMAIL: ${ASO_DEMO_EMAIL:-surgeon.demo@example.invalid}
      ASO_DEMO_PASSWORD: ${ASO_DEMO_PASSWORD:-DemoOnly-2026!}
      ASO_RUNTIME_DATABASE_PASSWORD: ${ASO_RUNTIME_DATABASE_PASSWORD:-demo-runtime-only}
      ASO_AUTHORITY_DATABASE_PASSWORD: ${ASO_AUTHORITY_DATABASE_PASSWORD:-demo-authority-only}
      ASO_GATE_AUTHORITY_DATABASE_PASSWORD: ${ASO_GATE_AUTHORITY_DATABASE_PASSWORD:-demo-gate-authority-only}
    volumes:
      - ./docker/demo-init.sh:/demo-init.sh:ro
    depends_on:
      aso-migrate:
        condition: service_completed_successfully
      kratos:
        condition: service_started
    restart: "no"

  # Synthetic-only inference. No provider key reaches the browser or assembly service.
  liter-llm:
    image: ${ASO_LITER_IMAGE:-aso-prior-auth-liter:local}
    build:
      context: ${LITER_LLM_ROOT:-/Users/gqadonis/Projects/references/liter-llm}
      dockerfile: ${ASO_PROJECT_ROOT:-/Users/gqadonis/Projects/TribeHealth/kevin/prior-auth}/docker/liter-llm/Dockerfile
      additional_contexts:
        aso: .
    environment:
      ASO_LITER_DATA_CLASS: synthetic
      QWEN_TOKEN_PLAN_OPENAI_URL: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      QWEN_TOKEN_PLAN_MODEL: qwen3.8-max
    secrets:
      - qwen_token_plan_api_key
      - aso_liter_synthetic_key
    expose:
      - "4000"
    restart: unless-stopped

  document-assembly:
    image: ${ASO_ASSEMBLY_IMAGE:-aso-prior-auth-assembly:local}
    build:
      context: .
      dockerfile: Dockerfile.demo
      target: assembly
    environment:
      ASO_DA_BIND: 0.0.0.0:8091
      ASO_DA_PACKAGES_DIR: /etc/aso/templates
      ASO_DA_PACKAGE_MANIFEST: /etc/aso/assembly-package-manifest.json
      ASO_ASSEMBLY_TOKEN_FILE: /run/secrets/aso_assembly_token
      ASO_MCP_APP_HTML: /etc/aso/mcp-app.html
      ASO_TASK_HOST_URL: http://aso-api:8788
      ASO_AGENT_PUBLIC_URL: http://document-assembly:8091
      ASO_WEB_PUBLIC_URL: http://127.0.0.1:${ASO_WEB_PORT:-5173}
      ASO_AGENT_ALLOWED_ORIGINS: http://127.0.0.1:${ASO_WEB_PORT:-5173},http://localhost:${ASO_WEB_PORT:-5173}
      RUST_LOG: warn
    volumes:
      - ./docs/architecture/fixtures/web-case-to-letter/assembly-package-manifest.json:/etc/aso/assembly-package-manifest.json:ro
    secrets:
      - aso_assembly_token
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8091/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  aso-api:
    image: ${ASO_API_IMAGE:-aso-prior-auth-api:local}
    build:
      context: .
      dockerfile: Dockerfile.demo
      target: api
    environment:
      ASO_DATABASE_URL: postgresql://aso_demo_runtime:${ASO_RUNTIME_DATABASE_PASSWORD:-demo-runtime-only}@db:5432/${POSTGRES_DB:-flint}
      ASO_GATE_DATABASE_URL: postgresql://aso_demo_runtime:${ASO_RUNTIME_DATABASE_PASSWORD:-demo-runtime-only}@db:5432/${POSTGRES_DB:-flint}
      ASO_SESSION_AUTHORITY_DATABASE_URL: postgresql://aso_demo_authority:${ASO_AUTHORITY_DATABASE_PASSWORD:-demo-authority-only}@db:5432/${POSTGRES_DB:-flint}
      ASO_KRATOS_PUBLIC_URL: http://kratos:4433
      ASO_KRATOS_ADMIN_URL: http://kratos:4434
      ASO_ALLOW_INSECURE_KRATOS: "true"
      ASO_DOCUMENT_STORE_ROOT: /var/lib/aso/documents
      ASO_DOCUMENT_PROCESSOR_IDENTITY_ID: 10000000-0000-4000-8000-000000000016
      ASO_DOCUMENT_PROCESSOR_ACTOR_ID: 10000000-0000-4000-8000-000000000015
      ASO_DOCUMENT_PROCESSOR_PRACTICE_ID: 10000000-0000-4000-8000-000000000001
      ASO_BIND_ADDRESS: 0.0.0.0
      ASO_PORT: 8788
      ASO_GENERATION_ROUTE: synthetic
      ASO_DA_PACKAGE_MANIFEST: /etc/aso/assembly-package-manifest.json
      ASO_ASSEMBLY_URL: http://document-assembly:8091
      ASO_ASSEMBLY_TOKEN_FILE: /run/secrets/aso_assembly_token
      ASO_LITER_SYNTHETIC_URL: http://liter-llm:4000
      ASO_LITER_SYNTHETIC_KEY_FILE: /run/secrets/aso_liter_synthetic_key
      QWEN_TOKEN_PLAN_MODEL: qwen3.8-max
      ASO_AGENT_ALLOWED_ORIGINS: http://127.0.0.1:${ASO_WEB_PORT:-5173},http://localhost:${ASO_WEB_PORT:-5173}
      RUST_LOG: ${RUST_LOG:-info,aso_web_server=debug}
    volumes:
      - demo_documents:/var/lib/aso/documents
      - ./docs/architecture/fixtures/web-case-to-letter/assembly-package-manifest.json:/etc/aso/assembly-package-manifest.json:ro
    secrets:
      - aso_assembly_token
      - aso_liter_synthetic_key
    ports:
      - "${ASO_API_PORT:-8788}:8788"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8788/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      aso-demo-init:
        condition: service_completed_successfully
      document-assembly:
        condition: service_healthy
      liter-llm:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${ASO_WEB_IMAGE:-aso-prior-auth-web:local}
    build:
      context: .
      dockerfile: Dockerfile.demo
      target: web
    environment:
      ASO_API_PROXY_TARGET: http://aso-api:8788
      ASO_AGENT_PROXY_TARGET: http://document-assembly:8091
      ASO_CLINICAL_GATE_PROXY_TARGET: http://aso-api:8788
      ASO_KRATOS_PROXY_TARGET: http://kratos:4433
      ASO_GATE_PROXY_TARGET: http://flint-gate:4456
      VITE_ASO_SHAPE_GATEWAY: /
      VITE_ASO_REPLICA_PERSISTENCE: memory
      VITE_ASO_ENABLE_RA11C_MATERIALIZER: experimental
    ports:
      - "${ASO_WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      aso-api:
        condition: service_healthy
      flint-gate:
        condition: service_healthy
      realtime-fabric:
        condition: service_healthy
    restart: unless-stopped

  gate-keys:
    image: ${ASO_DB_IMAGE:-aso-prior-auth-db:local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /keys/private.pem ]; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/private.pem
          openssl pkey -in /keys/private.pem -pubout -out /keys/public.pem
        fi
        chown 1001:1001 /keys/private.pem /keys/public.pem
        chmod 600 /keys/private.pem
        chmod 644 /keys/public.pem
    volumes:
      - gate_keys:/keys
    restart: "no"

  redis:
    image: redis@sha256:718f745deb7dfefeac6eed7041fc7ec9476b50e61b247932682457c41adafa0e
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  iggy-server:
    image: iggyrs/iggy@sha256:68a314c1380be5a792a134f3bd346ded42bd49d9f7114c86f70b48fc85bc5272
    environment:
      IGGY_SYSTEM_PATH: /data
    volumes:
      - iggy_data:/data
    healthcheck:
      test: ["CMD", "iggy", "--transport", "tcp", "--tcp-server-address", "localhost:8090", "-u", "iggy", "-p", "iggy", "me"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  flint-gate-init:
    image: ${ASO_GATE_IMAGE:-aso-prior-auth-flint-gate:local}
    build:
      context: ${PROMETHEUS_ROOT:-/Users/gqadonis/Projects/prometheus}/flint-gate
    command: ["--database-init-only"]
    volumes:
      - ./docker/flint-gate/config.ra05.yaml:/app/config/config.yaml:ro
      - gate_keys:/run/ra05-keys:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flint}:${POSTGRES_PASSWORD:-flint}@db:5432/flintgate
      FLINT_GATE_CONFIG: /app/config/config.yaml
      FLINT_GATE_REQUIRE_DATABASE: "true"
      FLINT_GATE_JWT_KEY_PATH: /run/ra05-keys/private.pem
      FLINT_GATE_JWT_PUBLIC_KEY_PATH: /run/ra05-keys/public.pem
      FLINT_GATE_ASO_AUTHORITY_DATABASE_URL: postgresql://aso_demo_gate_authority:${ASO_GATE_AUTHORITY_DATABASE_PASSWORD:-demo-gate-authority-only}@db:5432/${POSTGRES_DB:-flint}
    depends_on:
      aso-demo-init:
        condition: service_completed_successfully
      gate-keys:
        condition: service_completed_successfully
    restart: "no"

  # Validates the Kratos session, resolves the fresh ASO replica grant, and
  # mints the bounded token accepted by the shape facade.
  flint-gate:
    image: ${ASO_GATE_IMAGE:-aso-prior-auth-flint-gate:local}
    build:
      context: ${PROMETHEUS_ROOT:-/Users/gqadonis/Projects/prometheus}/flint-gate
    volumes:
      - ./docker/flint-gate/config.ra05.yaml:/app/config/config.yaml:ro
      - gate_keys:/run/ra05-keys:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-flint}:${POSTGRES_PASSWORD:-flint}@db:5432/flintgate
      FLINT_GATE_CONFIG: /app/config/config.yaml
      FLINT_GATE_REQUIRE_DATABASE: "true"
      FLINT_GATE_JWT_KEY_PATH: /run/ra05-keys/private.pem
      FLINT_GATE_JWT_SECRET: ""
      FLINT_GATE_ASO_AUTHORITY_DATABASE_URL: postgresql://aso_demo_gate_authority:${ASO_GATE_AUTHORITY_DATABASE_PASSWORD:-demo-gate-authority-only}@db:5432/${POSTGRES_DB:-flint}
      RUST_LOG: ${RUST_LOG:-info,flint_gate=info}
    ports:
      - "${GATE_PROXY_PORT:-4456}:4456"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/4457; printf 'GET /ready HTTP/1.0\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      flint-gate-init:
        condition: service_completed_successfully
      kratos:
        condition: service_started
      redis:
        condition: service_healthy
      aso-api:
        condition: service_healthy
    restart: unless-stopped

  # The browser names only a catalog shape. The facade owns its base table,
  # projected columns, and verified-practice predicate before calling Electric.
  realtime-fabric:
    image: ${ASO_FRF_IMAGE:-aso-prior-auth-realtime-fabric:local}
    build:
      context: ${PROMETHEUS_ROOT:-/Users/gqadonis/Projects/prometheus}/flint-realtime-fabric
      args:
        CARGO_FEATURES: shape-facade
    volumes:
      - ./docker/frf/shape-catalog.json:/app/config/shape-catalog.json:ro
    environment:
      BIND_ADDR: 0.0.0.0:8080
      GATEWAY_PROFILE: shape-only
      GRPC_PORT: "0"
      AUTHZ_BACKEND: verified-identity
      GATEWAY_JWKS_URL: http://flint-gate:4456/.well-known/jwks.json
      JWT_AUDIENCE: frf-gateway
      JWT_ISSUER: https://gate.aso.local
      SFU_MODE: sovereign
      CDC_ENABLED: "false"
      FEDERATION_ENABLED: "false"
      POLICY_ENGINE: none
      SHAPE_ELECTRIC_URL: http://electric:3000
      SHAPE_CATALOG_PATH: /app/config/shape-catalog.json
      RUST_LOG: ${RUST_LOG:-info,frf_gateway=info}
    depends_on:
      electric:
        condition: service_started
      flint-gate:
        condition: service_healthy
      iggy-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  demo_documents:
  gate_keys:
  iggy_data:

# Environment-backed Compose secrets are mounted only into the named services.
# Supply values from the local ignored .env or the operator's secret manager.
secrets:
  qwen_token_plan_api_key:
    environment: QWEN_TOKEN_PLAN_API_KEY
  aso_liter_synthetic_key:
    environment: ASO_LITER_SYNTHETIC_KEY
  aso_assembly_token:
    environment: ASO_ASSEMBLY_TOKEN
