fication\",\"prometheus-ui-review\"]\nOwnership and skill names are coordination instructions; native permissions and installed skills remain authoritative.\nFor UI review only, load prometheus-ui-review. Review at the completed phase boundary in a separate context. Never load taste skills, redesign the surface, or bypass user-only skill restrictions. Backend work does not activate UI guidance."
