# TJ-ARCH-MOB-001 compliant
# ═══════════════════════════════════════════════════════════════════════════
# PatientGPT — shared Rust core
#
# The dependency direction between these crates is the architecture:
#
#   patient-gpt-domain   DTOs and enums only. No I/O dependency.
#   patient-gpt-host     AppServices + ports + synthetic fixture. Names no
#                        shell: no Axum, no Tauri, no Flutter.
#   patient-gpt-uar      UarRuntimeFacade implementations (host defines the
#                        port; this crate implements it).
#   patient-gpt-storage  ConversationStore implementations. SurrealDB 3.3.0
#                        embedded sits behind the `surreal` feature.
#   patient-gpt-server   Axum router + thin web-server binary.
#
# `desktop/src-tauri` and `crates/patient-gpt-ffi` are added by their owners.
# ═══════════════════════════════════════════════════════════════════════════
[workspace]
resolver = "3"
members = [
  "crates/patient-gpt-domain",
  "crates/patient-gpt-host",
  "crates/patient-gpt-uar",
  "crates/patient-gpt-storage",
  "crates/patient-gpt-server",
  "crates/patient-gpt-ffi",
  "desktop/src-tauri",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.94"
license      = "UNLICENSED"

# Exact pins, verified against crates.io on 2026-10-25.
# Provenance and the proposed versions.toml entries: docs/plan/scaffold-plan.md.
# versions.toml is operator-only; these pins are proposed there, not recorded.
[workspace.dependencies]
axum               = { version = "=0.8.9" }
tower-http         = { version = "=0.7.1", features = ["fs", "trace", "cors"] }
tokio              = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
serde              = { version = "=1.0.229", features = ["derive"] }
serde_json         = "=1.0.154"
thiserror          = "=2.0.21"
uuid               = { version = "=1.29.0", features = ["v4", "v7", "serde"] }
tracing            = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
async-trait        = "=0.1.92"
futures            = "=0.3.34"
tokio-stream       = "=0.1.19"
# Embedded engine only (no remote protocol features). kv-rocksdb is the
# durable on-disk engine for the desktop lane; see patient-gpt-storage.
surrealdb          = { version = "=3.3.5", default-features = false, features = ["kv-rocksdb"] }
# Desktop shell (desktop/src-tauri). Verified against crates.io 2026-10-25.
tauri                        = { version = "=2.12.5" }
tauri-build                  = { version = "=2.7.4" }
tauri-plugin-single-instance = { version = "=2.5.4" }
# Must equal the installed flutter_rust_bridge_codegen (2.12.0); 2.13.0 is newer
# and deliberately not used. Consumed only by crates/patient-gpt-ffi.
flutter_rust_bridge = { version = "=2.12.0" }

patient-gpt-domain  = { path = "crates/patient-gpt-domain" }
patient-gpt-host    = { path = "crates/patient-gpt-host" }
patient-gpt-uar     = { path = "crates/patient-gpt-uar" }
patient-gpt-storage = { path = "crates/patient-gpt-storage" }
