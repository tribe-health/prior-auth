<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PatientGPT · Advanced Spine &amp; Orthopedics</title>
<meta name="description" content="PatientGPT: chat-first prior authorization for Advanced Spine &amp; Orthopedics. Chats are scoped to all patients, one patient, or one case.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/brand/favicon-16.png" type="image/png" sizes="16x16">
<link rel="alternate icon" href="/brand/favicon.ico">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" sizes="180x180">
<link rel="manifest" href="/manifest.webmanifest">
<script>
  /* set the theme before first paint: stored choice, else the system setting */
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('aso-theme'); } catch (err) { stored = null; }
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
</head>
<body>
<div id="root"></div>
<div class="sr-only" id="live" aria-live="polite"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
